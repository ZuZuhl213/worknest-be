spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: worknest

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DATABASE}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis

  quartz:
    job-store-type: memory
    properties:
      org:
        quartz:
          scheduler:
            instanceName: WorkNestScheduler
          threadPool:
            threadCount: 3

server: 
  port: ${SERVER_PORT}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

aws:
  s3:
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    region: ${AWS_REGION:auto}
    endpoint: ${S3_ENDPOINT:}
    bucket-name: ${S3_BUCKET_NAME:}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-dev-secret-key-to-a-long-random-value}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
  scheduler:
    overdue-task:
      interval-ms: ${OVERDUE_TASK_INTERVAL_MS:300000}
