spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: worknest

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DATABASE}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:60000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:240000}
      keepalive-time: ${DB_POOL_KEEPALIVE_TIME:60000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT:5000}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  cache:
    type: redis

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org:
        quartz:
          scheduler:
            instanceName: WorkNestScheduler
            instanceId: AUTO
          jobStore:
            class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
            isClustered: true
          threadPool:
            threadCount: 3

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:${PORT:8000}}
  forward-headers-strategy: framework
  error:
    include-message: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId}] %logger{36} - %msg%n"

aws:
  s3:
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    region: ${AWS_REGION:auto}
    endpoint: ${S3_ENDPOINT:}
    bucket-name: ${S3_BUCKET_NAME:}

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:worknest}
    audience: ${JWT_AUDIENCE:worknest-web}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  email:
    enabled: ${EMAIL_ENABLED:false}
    from: ${EMAIL_FROM:no-reply@worknest.local}
    password-reset-token-expiration-ms: ${PASSWORD_RESET_TOKEN_EXPIRATION:3600000}
    verification-token-expiration-ms: ${EMAIL_VERIFICATION_TOKEN_EXPIRATION:86400000}
  scheduler:
    overdue-task:
      interval-ms: ${OVERDUE_TASK_INTERVAL_MS:300000}
    storage-cleanup:
      interval-ms: ${STORAGE_CLEANUP_INTERVAL_MS:60000}
  storage-cleanup:
    grace-period-ms: ${STORAGE_CLEANUP_GRACE_PERIOD_MS:86400000}

security:
  clamav:
    enabled: ${CLAMAV_ENABLED:false}
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
    timeout-ms: ${CLAMAV_TIMEOUT_MS:5000}
