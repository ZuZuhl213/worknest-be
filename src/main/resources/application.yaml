spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: worknest

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DATABASE}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:60000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:240000}
      keepalive-time: ${DB_POOL_KEEPALIVE_TIME:60000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT:5000}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  cache:
    type: redis

  quartz:
    job-store-type: memory
    properties:
      org:
        quartz:
          scheduler:
            instanceName: WorkNestScheduler
          threadPool:
            threadCount: 3

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

aws:
  s3:
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    region: ${AWS_REGION:auto}
    endpoint: ${S3_ENDPOINT:}
    bucket-name: ${S3_BUCKET_NAME:}

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:worknest}
    audience: ${JWT_AUDIENCE:worknest-web}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  scheduler:
    overdue-task:
      interval-ms: ${OVERDUE_TASK_INTERVAL_MS:300000}

security:
  clamav:
    enabled: ${CLAMAV_ENABLED:false}
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
    timeout-ms: ${CLAMAV_TIMEOUT_MS:5000}
